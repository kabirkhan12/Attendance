<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InOut User Portal</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex justify-center h-screen">
    <div class="w-full max-w-md bg-white h-full shadow-lg flex flex-col relative overflow-hidden">
        
        <!-- ================= LOGIN VIEW ================= -->
        <div id="loginView" class="p-8 flex flex-col justify-center h-full bg-white z-50 absolute inset-0">
            <div class="text-center mb-8">
                <i class="fas fa-user-clock text-5xl text-blue-600 mb-3"></i>
                <h1 class="text-3xl font-bold text-gray-800">InOut</h1>
                <p class="text-gray-500 text-sm mt-1">Employee Punch Portal</p>
            </div>
            <input type="text" id="userId" placeholder="Login ID" class="p-4 border rounded-lg mb-4 bg-gray-50 focus:outline-none focus:border-blue-500">
            <input type="password" id="userPassword" placeholder="Password" class="p-4 border rounded-lg mb-8 bg-gray-50 focus:outline-none focus:border-blue-500">
            <button onclick="userLogin()" class="bg-blue-600 text-white p-4 rounded-lg font-bold shadow-lg active:scale-95 transition">Login</button>
        </div>

        <!-- ================= APP VIEW (Hidden initially) ================= -->
        <div id="appView" class="hidden flex-col h-full w-full bg-gray-50">
            
            <!-- HEADER -->
            <div class="bg-blue-600 p-4 text-white flex justify-between items-center shadow-md z-10">
                <div class="flex items-center gap-2">
                    <i class="fas fa-user-circle text-2xl"></i>
                    <span id="userNameHeader" class="font-bold">Welcome</span>
                </div>
                <button onclick="location.reload()"><i class="fas fa-sign-out-alt text-xl hover:text-red-300"></i></button>
            </div>

            <!-- CAMERA SECTION (Height reduced for mobile fit) -->
            <div class="h-72 bg-black relative flex items-center justify-center overflow-hidden m-4 rounded-2xl shadow-inner border-4 border-gray-200">
                <video id="video" autoplay muted playsinline class="object-cover w-full h-full transform scale-x-[-1]"></video>
                
                <!-- Face Guide Overlay -->
                <div class="absolute inset-0 border-2 border-dashed border-white opacity-40 m-8 rounded-full pointer-events-none flex items-center justify-center">
                    <div class="w-full h-full bg-black bg-opacity-20 rounded-full"></div>
                </div>
                
                <!-- Status Banner overlay inside camera -->
                <div class="absolute bottom-4 left-0 right-0 flex justify-center">
                    <p id="statusText" class="text-white bg-black bg-opacity-70 px-4 py-2 rounded-full font-semibold text-xs tracking-wider uppercase backdrop-blur-sm shadow-lg">
                        <i class="fas fa-spinner fa-spin mr-2"></i>Loading Camera...
                    </p>
                </div>
            </div>

            <!-- CONTROLS SECTION -->
            <div class="flex-grow flex flex-col justify-start px-6">
                
                <!-- Registration Controls -->
                <div id="registerControls" class="hidden flex-col items-center">
                    <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg w-full mb-4">
                        <p class="text-center text-sm text-blue-800 font-medium"><i class="fas fa-info-circle mr-1"></i> First time setup: Please look directly at the camera in good lighting to register your face biometric.</p>
                    </div>
                    <button onclick="registerFace()" class="w-full bg-blue-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition flex justify-center items-center gap-2">
                        <i class="fas fa-camera"></i> REGISTER MY FACE
                    </button>
                </div>

                <!-- Punch In/Out Controls -->
                <div id="punchControls" class="hidden flex-col gap-4">
                    <div class="grid grid-cols-2 gap-4">
                        <button onclick="recordAttendance('in')" class="bg-green-500 hover:bg-green-600 text-white py-5 rounded-2xl font-bold text-lg shadow-[0_4px_14px_0_rgba(34,197,94,0.39)] active:scale-95 transition flex flex-col items-center justify-center gap-1">
                            <i class="fas fa-sign-in-alt text-2xl"></i>
                            PUNCH IN
                        </button>
                        <button onclick="recordAttendance('out')" class="bg-orange-500 hover:bg-orange-600 text-white py-5 rounded-2xl font-bold text-lg shadow-[0_4px_14px_0_rgba(249,115,22,0.39)] active:scale-95 transition flex flex-col items-center justify-center gap-1">
                            <i class="fas fa-sign-out-alt text-2xl"></i>
                            PUNCH OUT
                        </button>
                    </div>
                    <div class="text-center mt-2">
                        <p id="punchStatusMsg" class="text-sm font-medium text-gray-500">Position face in frame and tap to punch.</p>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://cighgvyjwaagdhmiohlb.supabase.co';
        const supabaseKey = 'sb_publishable_ZTzdxKpodw0lWcBaMt0IzQ_leTZnHfC';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        let currentUser = null;
        const video = document.getElementById('video');
        const statusText = document.getElementById('statusText');

        // --- AUTHENTICATION ---
        async function userLogin() {
            const loginId = document.getElementById('userId').value;
            const password = document.getElementById('userPassword').value;
            
            if(!loginId || !password) return alert("Enter Login ID and Password.");

            const { data, error } = await supabaseClient.from('employees')
                .select('*').eq('login_id', loginId).eq('password', password).single();
            
            if (error || !data) return alert("Invalid Login ID or Password");
            
            currentUser = data;
            document.getElementById('userNameHeader').innerText = currentUser.name;
            
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('appView').classList.remove('hidden');
            document.getElementById('appView').classList.add('flex');

            if (!currentUser.face_descriptor) {
                document.getElementById('registerControls').classList.remove('hidden');
                document.getElementById('registerControls').classList.add('flex');
            } else {
                document.getElementById('punchControls').classList.remove('hidden');
                document.getElementById('punchControls').classList.add('flex');
            }

            loadModels();
        }

        // --- CAMERA & AI SETUP ---
        async function loadModels() {
            statusText.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Loading AI...';
            const MODEL_URL = './models';
            try {
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                startVideo();
            } catch (err) {
                statusText.innerHTML = '<i class="fas fa-exclamation-triangle mr-2 text-red-500"></i>Error loading models.';
            }
        }

        async function startVideo() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
                statusText.innerHTML = '<i class="fas fa-check-circle mr-2 text-green-400"></i>Camera Ready';
            } catch (err) {
                statusText.innerHTML = '<i class="fas fa-video-slash mr-2 text-red-500"></i>Access Denied!';
            }
        }

        // --- FACE REGISTRATION ---
        async function registerFace() {
            statusText.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Scanning Face...';
            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
            
            if (!detection) {
                statusText.innerHTML = '<i class="fas fa-check-circle mr-2 text-green-400"></i>Camera Ready';
                return alert("No face detected! Look directly at the camera in good lighting.");
            }
            
            const descriptorString = JSON.stringify(Array.from(detection.descriptor));
            
            const { error } = await supabaseClient.from('employees')
                .update({ face_descriptor: descriptorString })
                .eq('id', currentUser.id);
            
            if (error) return alert("Error saving face: " + error.message);
            
            alert("Face Registered Successfully! You can now Punch In/Out.");
            currentUser.face_descriptor = descriptorString;
            
            document.getElementById('registerControls').classList.add('hidden');
            document.getElementById('registerControls').classList.remove('flex');
            document.getElementById('punchControls').classList.remove('hidden');
            document.getElementById('punchControls').classList.add('flex');
            statusText.innerHTML = '<i class="fas fa-check-circle mr-2 text-green-400"></i>Camera Ready';
        }

        // --- NEW FLEXI-ATTENDANCE LOGIC (JSONB ARRAY) ---
        async function recordAttendance(type) {
            statusText.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Verifying Identity...';
            
            // 1. Biometric Check
            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
            if (!detection) {
                statusText.innerHTML = '<i class="fas fa-check-circle mr-2 text-green-400"></i>Camera Ready';
                return alert("No face detected! Look directly at the camera.");
            }

            const liveDesc = detection.descriptor;
            const savedDesc = new Float32Array(JSON.parse(currentUser.face_descriptor));
            const distance = faceapi.euclideanDistance(liveDesc, savedDesc);
            
            if (distance > 0.6) {
                statusText.innerHTML = '<i class="fas fa-times-circle mr-2 text-red-400"></i>Match Failed';
                setTimeout(() => statusText.innerHTML = '<i class="fas fa-check-circle mr-2 text-green-400"></i>Camera Ready', 2000);
                return alert("Face does NOT match the registered user! Access Denied.");
            }

            // 2. Fetch today's database record to append/update the punches array
            const now = new Date().toISOString();
            const dateOnly = new Date().toISOString().split('T')[0];
            const msgEl = document.getElementById('punchStatusMsg');

            const { data: record, error: fetchErr } = await supabaseClient
                .from('attendance')
                .select('*')
                .eq('employee_id', currentUser.id)
                .eq('date', dateOnly)
                .single(); // Might return error if no row exists today

            let punches = record ? record.punches || [] : [];
            let totalHrs = record ? record.total_hours || 0 : 0;

            if (type === 'in') {
                // Prevent double punch-in
                if (punches.length > 0 && !punches[punches.length - 1].out) {
                    statusText.innerHTML = '<i class="fas fa-check-circle mr-2 text-green-400"></i>Camera Ready';
                    return alert("You are already Punched IN!");
                }

                punches.push({ in: now });

                if (!record) {
                    // Create first record of the day
                    const { error } = await supabaseClient.from('attendance').insert([{
                        employee_id: currentUser.id,
                        date: dateOnly,
                        punches: punches,
                        total_hours: 0,
                        status: 'Present'
                    }]);
                    if (error) return alert("Error inserting data: " + error.message);
                } else {
                    // Append punch to existing record (2nd shift)
                    const { error } = await supabaseClient.from('attendance').update({ punches }).eq('id', record.id);
                    if (error) return alert("Error updating data: " + error.message);
                }
                
                msgEl.innerHTML = `<span class="text-green-600 font-bold">Punched IN at ${new Date().toLocaleTimeString()}</span>`;
                alert("Punch IN Successful!");

            } else {
                // type === 'out'
                if (punches.length === 0 || punches[punches.length - 1].out) {
                    statusText.innerHTML = '<i class="fas fa-check-circle mr-2 text-green-400"></i>Camera Ready';
                    return alert("You need to Punch IN first!");
                }
                
                let lastPunch = punches[punches.length - 1];
                lastPunch.out = now;

                // Calculate hours for this specific shift session
                let inTime = new Date(lastPunch.in).getTime();
                let outTime = new Date(lastPunch.out).getTime();
                let sessionHrs = (outTime - inTime) / (1000 * 60 * 60); // convert ms to hours
                totalHrs += sessionHrs;

                const { error } = await supabaseClient.from('attendance').update({
                    punches: punches,
                    total_hours: totalHrs
                }).eq('id', record.id);
                
                if (error) return alert("Error saving punch out: " + error.message);
                
                msgEl.innerHTML = `<span class="text-orange-600 font-bold">Punched OUT at ${new Date().toLocaleTimeString()}<br>Hours today: ${totalHrs.toFixed(2)}</span>`;
                alert("Punch OUT Successful!");
            }
            
            statusText.innerHTML = '<i class="fas fa-check-circle mr-2 text-green-400"></i>Camera Ready';
        }
    </script>
</body>
</html>
