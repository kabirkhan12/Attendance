<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Corporate Management</title>
    <link rel="icon" href="data:,">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS v2 -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        /* Custom scrollbar styling */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: #f8fafc; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        /* HARD CSS ENFORCEMENT PREVENTING MOBILE/DESKTOP LEAKS */
        @media (max-width: 1023px) {
            .desktop-only { display: none !important; }
            .mobile-only { display: flex !important; }
            #appContainer {
                max-width: 28rem !important; /* max-w-md */
                height: 100dvh !important;
                border-radius: 0px !important;
                box-shadow: none !important;
            }
        }
        @media (min-width: 1024px) {
            .desktop-only { display: flex !important; }
            .mobile-only { display: none !important; }
            #appContainer {
                max-width: 80rem !important; /* max-w-7xl landscape */
                height: 94vh !important;
                border-radius: 1.25rem !important;
            }
        }
    </style>
</head>
<body class="bg-gray-900 flex justify-center items-center min-h-[100dvh] p-0 lg:p-6 transition-all select-none">

    <!-- MAIN APP CONTAINER -->
    <div id="appContainer" class="w-full bg-white shadow-2xl flex flex-col lg:flex-row overflow-hidden relative mx-auto transition-all duration-200">
        
        <!-- ================= CORPORATE LOGIN VIEW ================= -->
        <div id="loginView" class="p-6 lg:p-12 flex flex-col justify-center items-center h-full w-full bg-white z-50 absolute inset-0">
            <div class="w-full max-w-md">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 rounded-2xl bg-indigo-600 flex items-center justify-center text-white text-3xl shadow-lg mx-auto mb-4">
                        <i class="fas fa-building"></i>
                    </div>
                    <h1 class="text-2xl lg:text-3xl font-bold text-gray-800 tracking-tight">Corporate Login</h1>
                    <p class="text-gray-500 text-xs lg:text-sm mt-1">Authorized corporate executives & system operators</p>
                </div>

                <form onsubmit="event.preventDefault(); corporateLogin();" class="flex flex-col space-y-4">
                    <div>
                        <label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Corporate Email</label>
                        <input type="email" id="corpEmail" placeholder="corp@domain.com" class="w-full p-3.5 border rounded-xl bg-gray-50 text-sm outline-none focus:bg-white focus:border-indigo-500 transition" required>
                    </div>
                    <div>
                        <label class="text-[11px] font-bold text-gray-500 uppercase block mb-1">Security Key / Password</label>
                        <input type="password" id="corpPassword" placeholder="••••••••" class="w-full p-3.5 border rounded-xl bg-gray-50 text-sm outline-none focus:bg-white focus:border-indigo-500 transition" required>
                    </div>

                    <button type="submit" id="btnCorpLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-4 rounded-xl font-bold text-base shadow-lg active:scale-95 transition flex items-center justify-center gap-2 mt-2">
                        <span>Access System</span>
                        <i class="fas fa-arrow-right text-xs"></i>
                    </button>
                </form>
            </div>
        </div>

        <!-- ================= DESKTOP SIDEBAR (Strictly hidden on phones) ================= -->
        <aside id="desktopSidebar" class="desktop-only flex-col w-64 bg-slate-900 text-slate-300 flex-shrink-0 z-30 justify-between">
            <div>
                <!-- Brand Header -->
                <div class="p-5 border-b border-slate-800 flex items-center gap-3">
                    <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-md">
                        <i class="fas fa-network-wired"></i>
                    </div>
                    <div class="overflow-hidden">
                        <h2 class="text-sm font-bold text-white leading-tight truncate">Corporate HQ</h2>
                        <p class="text-[10px] text-indigo-400 font-medium flex items-center gap-1 mt-0.5">
                            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Multi-Tenant Mode
                        </p>
                    </div>
                </div>

                <!-- Navigation Summary Links -->
                <nav class="p-3 space-y-1">
                    <div class="w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold bg-indigo-600 text-white shadow-sm">
                        <i class="fas fa-city w-5 text-center text-base"></i> Firm Registry
                    </div>
                </nav>
            </div>

            <!-- Profile & Sign Out Footer -->
            <div class="p-4 border-t border-slate-800 bg-slate-950/40">
                <div class="flex items-center justify-between">
                    <div class="flex items-center gap-2 overflow-hidden">
                        <i class="fas fa-user-shield text-slate-400 text-base"></i>
                        <span id="corpUserLabel" class="text-xs font-semibold text-slate-300 truncate">Corporate Admin</span>
                    </div>
                    <button type="button" title="Sign Out" onclick="logout()" class="text-slate-400 hover:text-red-400 transition p-2">
                        <i class="fas fa-sign-out-alt text-base"></i>
                    </button>
                </div>
            </div>
        </aside>

        <!-- ================= MAIN DASHBOARD VIEW ================= -->
        <div id="dashboardView" class="hidden flex-1 flex-col h-full overflow-hidden w-full relative">
            
            <!-- MOBILE TOP HEADER (Strictly hidden on desktop) -->
            <header class="mobile-only bg-indigo-700 p-4 text-white justify-between items-center shadow-md z-20 flex-shrink-0">
                <div class="flex items-center gap-2.5">
                    <i class="fas fa-building text-base opacity-80"></i>
                    <h1 class="font-bold text-base tracking-tight">Corporate Dashboard</h1>
                </div>
                <button type="button" onclick="logout()" class="bg-indigo-800 hover:bg-indigo-900 px-3 py-1.5 rounded-lg text-xs font-semibold transition">
                    <i class="fas fa-sign-out-alt mr-1"></i> Logout
                </button>
            </header>

            <!-- DESKTOP TOP BAR (Strictly hidden on mobile) -->
            <header class="desktop-only bg-white border-b border-gray-200 px-6 py-4 justify-between items-center z-20 flex-shrink-0">
                <div class="flex items-center gap-3">
                    <span class="text-sm font-bold text-gray-800">Firm Provisioning & Management</span>
                    <span class="text-gray-300">|</span>
                    <span id="firmCountBadge" class="text-xs font-semibold text-indigo-600 bg-indigo-50 px-2.5 py-1 rounded-full border border-indigo-100">0 Firms Active</span>
                </div>
                <div class="flex items-center gap-3">
                    <button type="button" onclick="loadFirmAdmins()" class="text-xs font-semibold text-gray-600 hover:text-indigo-600 bg-gray-100 px-3 py-1.5 rounded-lg border transition flex items-center gap-1.5">
                        <i class="fas fa-sync-alt" id="refreshIcon"></i> Refresh List
                    </button>
                </div>
            </header>

            <!-- SCROLLABLE WORKSPACE: Stack on Mobile, Landscape Multi-Column on Desktop -->
            <main class="flex-1 overflow-y-auto bg-gray-100 p-3.5 lg:p-6">
                
                <div class="flex flex-col lg:flex-row gap-5 items-start">
                    
                    <!-- FORM COLUMN: Fixed Left on Desktop, Top Card on Mobile -->
                    <div class="w-full lg:w-96 flex-shrink-0">
                        <div class="bg-white p-4 lg:p-5 rounded-2xl shadow-sm border border-gray-200">
                            <div class="flex items-center gap-2 border-b pb-3 mb-4">
                                <i class="fas fa-plus-circle text-indigo-600"></i>
                                <h2 class="font-bold text-sm lg:text-base text-gray-800">Register New Firm Admin</h2>
                            </div>

                            <form onsubmit="event.preventDefault(); addFirmAdmin();" class="space-y-3">
                                <div>
                                    <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Firm Name</label>
                                    <input type="text" id="newFirmName" placeholder="e.g. GSM Solution" class="w-full p-2.5 border rounded-xl text-xs bg-gray-50 outline-none focus:bg-white focus:border-indigo-500 transition" required>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Admin Login ID / Email</label>
                                    <input type="text" id="newAdminEmail" placeholder="admin_identifier or email" class="w-full p-2.5 border rounded-xl text-xs bg-gray-50 outline-none focus:bg-white focus:border-indigo-500 transition" required>
                                </div>
                                <div>
                                    <label class="text-[10px] font-bold text-gray-500 uppercase block mb-1">Assigned Password</label>
                                    <input type="text" id="newAdminPassword" placeholder="Default login password" class="w-full p-2.5 border rounded-xl text-xs bg-gray-50 outline-none focus:bg-white focus:border-indigo-500 transition" required>
                                </div>

                                <button type="submit" id="btnCreateAdmin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white p-3 rounded-xl font-bold text-xs lg:text-sm shadow-md transition active:scale-95 flex items-center justify-center gap-1.5 mt-2">
                                    <i class="fas fa-check"></i>
                                    <span>Create Firm Admin</span>
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- FIRMS LIST COLUMN: Expanded Grid/List -->
                    <div class="w-full lg:flex-1 flex flex-col">
                        <div class="flex justify-between items-center mb-3">
                            <h2 class="font-bold text-xs lg:text-sm text-gray-700 uppercase tracking-wider">Active Firms &amp; Admins</h2>
                            <span id="mobileCountBadge" class="lg:hidden text-[10px] font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full">0 firms</span>
                        </div>

                        <!-- Firm Cards Grid -->
                        <div id="adminList" class="grid grid-cols-1 md:grid-cols-2 gap-3 pb-8">
                            <!-- Populated dynamically -->
                        </div>
                    </div>

                </div>

            </main>
        </div>

    </div>

    <!-- ================= JAVASCRIPT LOGIC ================= -->
    <script>
        const supabaseUrl = 'https://cighgvyjwaagdhmiohlb.supabase.co';
        const supabaseKey = 'sb_publishable_ZTzdxKpodw0lWcBaMt0IzQ_leTZnHfC';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        // 1. Corporate Login via Supabase Auth
        async function corporateLogin() {
            const email = document.getElementById('corpEmail').value.trim();
            const password = document.getElementById('corpPassword').value.trim();
            if (!email || !password) return alert("Please fill in corporate credentials.");

            const btn = document.getElementById('btnCorpLogin');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Authenticating...';
            btn.disabled = true;

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password
            });

            btn.innerHTML = '<span>Access System</span><i class="fas fa-arrow-right text-xs"></i>';
            btn.disabled = false;

            if (error) {
                alert("Access Denied: " + error.message);
                return;
            }

            activateDashboard(data.session?.user?.email);
        }

        // 2. Activate Dashboard Views
        function activateDashboard(userEmail) {
            if (userEmail) {
                document.getElementById('corpUserLabel').innerText = userEmail;
            }
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            document.getElementById('dashboardView').classList.add('flex');
            loadFirmAdmins();
        }

        // 3. Add a new Admin account into 'admins' table
        async function addFirmAdmin() {
            const firm_name = document.getElementById('newFirmName').value.trim();
            const email = document.getElementById('newAdminEmail').value.trim();
            const password = document.getElementById('newAdminPassword').value.trim();

            if (!firm_name || !email || !password) return alert("All fields are required!");

            const btn = document.getElementById('btnCreateAdmin');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i> Creating...';
            btn.disabled = true;

            const { error } = await supabaseClient.from('admins').insert([{
                firm_name: firm_name,
                email: email,
                password: password
            }]);

            btn.innerHTML = '<i class="fas fa-check"></i><span>Create Firm Admin</span>';
            btn.disabled = false;

            if (error) {
                alert("Error: " + error.message);
            } else {
                alert("Firm Admin created successfully!");
                document.getElementById('newFirmName').value = '';
                document.getElementById('newAdminEmail').value = '';
                document.getElementById('newAdminPassword').value = '';
                loadFirmAdmins();
            }
        }

        // 4. Load all admins from database
        async function loadFirmAdmins() {
            const refreshIcon = document.getElementById('refreshIcon');
            if (refreshIcon) refreshIcon.classList.add('fa-spin');

            const { data, error } = await supabaseClient.from('admins').select('*').order('id', { ascending: false });

            if (refreshIcon) refreshIcon.classList.remove('fa-spin');

            if (error) {
                console.error("Error fetching admins:", error);
                return;
            }

            const total = data ? data.length : 0;
            document.getElementById('firmCountBadge').innerText = `${total} Firms Active`;
            document.getElementById('mobileCountBadge').innerText = `${total} firms`;

            const list = document.getElementById('adminList');
            if (!data || data.length === 0) {
                list.innerHTML = `<div class="col-span-full p-8 text-center text-gray-400 bg-white rounded-xl border border-gray-200 text-xs">No firm admins registered yet.</div>`;
                return;
            }

            list.innerHTML = data.map(admin => `
                <div class="bg-white p-4 rounded-xl shadow-xs border border-gray-200 hover:border-indigo-300 transition flex flex-col justify-between">
                    <div>
                        <div class="flex items-center justify-between gap-2 mb-2">
                            <h3 class="font-bold text-indigo-700 text-sm lg:text-base leading-tight truncate">${admin.firm_name || 'Unnamed Firm'}</h3>
                            <span class="text-[9px] bg-slate-100 text-slate-500 font-mono px-1.5 py-0.5 rounded">ID: ${admin.id}</span>
                        </div>
                        <div class="space-y-1 text-xs text-gray-600 bg-gray-50 p-2.5 rounded-lg border border-gray-100 font-mono">
                            <p class="flex justify-between"><span class="text-gray-400 font-sans">Login ID:</span> <span class="font-bold text-gray-800">${admin.email}</span></p>
                            <p class="flex justify-between"><span class="text-gray-400 font-sans">Password:</span> <span class="text-indigo-600">${admin.password}</span></p>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 5. Logout
        async function logout() {
            await supabaseClient.auth.signOut();
            location.reload();
        }

        // 6. Check Active Session on load
        async function checkSession() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (session) {
                activateDashboard(session.user?.email);
            }
        }

        checkSession();
    </script>
</body>
</html>
