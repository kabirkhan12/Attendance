<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Labour Attendance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- 1. Added face-api.js library -->
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
</head>
<body class="bg-gray-100 flex justify-center h-screen bg-black">
    <div class="w-full max-w-md bg-white h-full shadow-lg flex flex-col relative">
        
        <!-- Header -->
        <div class="p-4 bg-green-600 text-white flex justify-between items-center z-10">
            <a href="index.html" class="text-sm font-bold">&larr; Back</a>
            <h1 class="text-lg font-bold">Face Attendance</h1>
            <div class="w-10"></div>
        </div>

        <!-- Camera Viewfinder -->
        <div class="flex-grow bg-black relative flex items-center justify-center overflow-hidden">
            <video id="video" autoplay muted playsinline class="object-cover w-full h-full"></video>
            <div class="absolute inset-0 border-4 border-dashed border-white opacity-50 m-12 rounded-lg pointer-events-none"></div>
            <p id="statusText" class="absolute bottom-4 text-white bg-black bg-opacity-75 px-4 py-2 rounded font-semibold text-center w-3/4">Initializing...</p>
        </div>

        <!-- Controls -->
        <div class="p-6 bg-white rounded-t-3xl -mt-6 z-10 flex gap-4">
            <button onclick="recordAttendance('in')" class="flex-1 bg-green-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition">PUNCH IN</button>
            <button onclick="recordAttendance('out')" class="flex-1 bg-red-600 text-white py-4 rounded-xl font-bold text-lg shadow-lg active:scale-95 transition">PUNCH OUT</button>
        </div>
    </div>

    <script>
        // Supabase Setup
        const supabaseUrl = 'https://cighgvyjwaagdhmiohlb.supabase.co';
        const supabaseKey = 'sb_publishable_ZTzdxKpodw0lWcBaMt0IzQ_leTZnHfC';
        const supabase = supabaseCreateClient.createClient(supabaseUrl, supabaseKey);

        const video = document.getElementById('video');
        const statusText = document.getElementById('statusText');
        
        let faceMatcher = null;

        // 2. Load the models from your GitHub /models folder
        async function loadModels() {
            statusText.innerText = "Loading AI Models...";
            const MODEL_URL = './models'; // Points to the folder you created in GitHub
            
            try {
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                
                statusText.innerText = "Models Loaded. Starting Camera...";
                await startVideo();
                await fetchRegisteredFaces();
            } catch (err) {
                statusText.innerText = "Error loading models. Check folder path.";
                console.error(err);
            }
        }

        // 3. Start the Camera
        async function startVideo() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                video.srcObject = stream;
            } catch (err) {
                statusText.innerText = "Camera Access Denied!";
            }
        }

        // 4. Fetch stored biometrics from Supabase to prepare for matching
        async function fetchRegisteredFaces() {
            statusText.innerText = "Loading Labour Data...";
            const firmId = localStorage.getItem('firm_id');
            
            if(!firmId) {
                statusText.innerText = "Error: Firm ID not found. Go to home page.";
                return;
            }

            const { data: labours, error } = await supabase.from('labours').select('*').eq('firm_id', firmId);
            
            if (error) {
                statusText.innerText = "Error loading data.";
                return;
            }

            // Convert stored text back into Float32Arrays for the AI to read
            const labeledDescriptors = [];
            for (let i = 0; i < labours.length; i++) {
                if (labours[i].face_descriptor && labours[i].face_descriptor !== 'pending_enrollment') {
                    const descArray = new Float32Array(JSON.parse(labours[i].face_descriptor));
                    // We use the labour's UUID as the label to identify them later
                    labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(labours[i].id, [descArray]));
                }
            }

            if(labeledDescriptors.length > 0) {
                // 0.6 is the standard threshold for matching accuracy
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6); 
                statusText.innerText = "Ready! Position face in frame.";
            } else {
                statusText.innerText = "No faces registered yet.";
            }
        }

        // 5. The actual Punch In/Out logic
        async function recordAttendance(type) {
            if(!faceMatcher) return alert("No face data loaded. Please register labours in the Admin portal first.");
            
            statusText.innerText = "Scanning Face...";
            
            // Capture and analyze the face currently on screen
            const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
            
            if (!detection) {
                statusText.innerText = "Ready! Position face in frame.";
                return alert("No face detected. Please look directly at the camera and ensure good lighting.");
            }

            // Compare the live face against our Supabase database
            const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
            
            if (bestMatch.label === 'unknown') {
                statusText.innerText = "Ready! Position face in frame.";
                return alert("Face not recognized! Please try again.");
            }

            const matchedLabourId = bestMatch.label; // This is the labour's Supabase UUID
            const now = new Date().toISOString();
            const dateOnly = new Date().toISOString().split('T')[0];

            if (type === 'in') {
                // Record Punch In
                const { error } = await supabase.from('attendance').insert([{
                    labour_id: matchedLabourId, date: dateOnly, punch_in: now
                }]);
                
                if (error) {
                    // Assuming error 23505 is a unique constraint violation (already punched in today)
                    if(error.code === '23505') alert("Already punched in today!");
                    else alert("Error punching in: " + error.message);
                } else {
                    alert("Punch IN Successful!");
                }
            } else {
                // Record Punch Out
                const { error } = await supabase.from('attendance')
                    .update({ punch_out: now })
                    .eq('labour_id', matchedLabourId)
                    .eq('date', dateOnly);
                
                if (error) alert("Error punching out: " + error.message);
                else alert("Punch OUT Successful!");
            }
            
            statusText.innerText = "Ready! Position face in frame.";
        }

        // Boot everything up when the page loads
        loadModels();
    </script>
</body>
</html>
