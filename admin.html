<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>InOut Admin Dashboard</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-200 flex justify-center h-[100dvh]">
    <div class="w-full max-w-md bg-white h-full shadow-2xl flex flex-col overflow-hidden relative mx-auto">
        
        <!-- LOGIN VIEW -->
        <div id="loginView" class="p-8 flex flex-col justify-center h-full bg-white z-50 absolute inset-0">
            <div class="text-center mb-8">
                <i class="fas fa-fingerprint text-5xl text-blue-600 mb-3"></i>
                <h1 class="text-3xl font-bold text-gray-800">Admin Login</h1>
                <p class="text-gray-500 text-sm mt-1">Manage your workforce</p>
            </div>
            <input type="text" id="adminEmail" placeholder="Admin ID (e.g. gsm_admin)" class="p-4 border rounded-lg mb-4 bg-gray-50 outline-none focus:border-blue-500">
            <input type="password" id="adminPassword" placeholder="Password" class="p-4 border rounded-lg mb-8 bg-gray-50 outline-none focus:border-blue-500">
            <button onclick="adminLogin()" class="bg-blue-600 text-white p-4 rounded-lg font-bold shadow-lg active:scale-95 transition">Login to Dashboard</button>
        </div>

        <!-- MAIN APP VIEW -->
        <div id="mainAppView" class="hidden flex-col h-full w-full">
            
            <header class="bg-blue-600 p-4 text-white flex justify-between items-center shadow-md z-20 flex-shrink-0">
                <div class="flex items-center gap-3"><h1 id="headerTitle" class="text-xl font-bold">Loading...</h1></div>
                <button onclick="logout()"><i class="fas fa-sign-out-alt text-xl hover:text-red-300 transition"></i></button>
            </header>

            <main class="flex-1 overflow-y-auto bg-gray-50">
                
                <!-- TAB 1: DASHBOARD -->
                <div id="tab-dashboard" class="p-4 flex flex-col min-h-full">
                    <h2 class="text-sm font-bold text-gray-700 mb-2">Employee Summary</h2>
                    <div class="grid grid-cols-5 gap-2 mb-4 text-center">
                        <button onclick="filterList('all')" class="border rounded py-2 bg-blue-50 border-blue-200 cursor-pointer"><p id="countAll" class="text-lg font-bold text-blue-600">0</p><p class="text-[9px] text-gray-500 font-bold">All Emp</p></button>
                        <button onclick="filterList('in')" class="border rounded py-2 bg-white cursor-pointer"><p id="countIn" class="text-lg font-bold text-green-500">0</p><p class="text-[9px] text-gray-500 font-bold">Total In</p></button>
                        <button onclick="filterList('out')" class="border rounded py-2 bg-white cursor-pointer"><p id="countOut" class="text-lg font-bold text-orange-500">0</p><p class="text-[9px] text-gray-500 font-bold">Total Out</p></button>
                        <button onclick="filterList('late')" class="border rounded py-2 bg-white cursor-pointer"><p id="countLate" class="text-lg font-bold text-red-500">0</p><p class="text-[9px] text-gray-500 font-bold">Late</p></button>
                        <button onclick="filterList('missing')" class="border rounded py-2 bg-white cursor-pointer"><p id="countMissing" class="text-lg font-bold text-gray-500">0</p><p class="text-[9px] text-gray-500 font-bold">Absent</p></button>
                    </div>

                    <div class="relative mb-4">
                        <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                        <input type="text" id="searchInput" onkeyup="searchEmployees()" placeholder="Search by name or code" class="w-full pl-10 p-2 border rounded-lg bg-white outline-none focus:border-blue-500 text-sm">
                    </div>

                    <h2 class="text-sm font-bold text-gray-700 mb-2 border-b pb-1">Today's Attendance</h2>
                    <div id="employeeList" class="flex flex-col gap-3 pb-6"></div>

                    <div class="mt-4 flex justify-center pb-4">
                        <button onclick="toggleAddForm()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-lg hover:bg-blue-700 transition">+ Add Employee</button>
                    </div>

                    <!-- Add Employee Form -->
                    <div id="addEmployeeForm" class="hidden mt-2 bg-white p-4 rounded-lg border shadow-sm">
                        <h3 class="font-bold mb-3 border-b pb-2">New Employee Details</h3>
                        <input type="text" id="eName" placeholder="Name" class="w-full p-2 border rounded mb-2 text-sm bg-gray-50">
                        <input type="text" id="eCode" placeholder="EMP Code" class="w-full p-2 border rounded mb-2 text-sm bg-gray-50">
                        <div class="grid grid-cols-2 gap-2 mb-2">
                            <input type="text" id="eLogin" placeholder="Login ID" class="p-2 border rounded text-sm bg-gray-50">
                            <input type="text" id="ePass" placeholder="Password" class="p-2 border rounded text-sm bg-gray-50">
                        </div>
                        <select id="eDept" onchange="handleDeptChange()" class="w-full p-2 border rounded mb-2 text-sm bg-gray-50">
                            <option value="General">General</option>
                            <option value="Service">Service</option>
                            <option value="Engineer">Engineer</option>
                            <option value="CCO">CCO</option>
                            <option value="Manager">Manager</option>
                            <option value="Other">Other (Specify)</option>
                        </select>
                        <input type="text" id="eDeptOther" placeholder="Enter Custom Department" class="hidden w-full p-2 border rounded mb-2 text-sm bg-gray-50">
                        <select id="eTiming" class="w-full p-2 border rounded mb-2 text-sm bg-gray-50">
                            <option value="9:30 TO 19:00">9:30 TO 7:00 (Fixed)</option>
                            <option value="10:00 TO 19:00">10:00 TO 7:00 (Fixed)</option>
                            <option value="Flexi Shift">Flexi Shift</option>
                        </select>
                        <div class="grid grid-cols-2 gap-2 mb-3">
                            <input type="number" id="eSalary" placeholder="Base Salary" class="p-2 border rounded text-sm bg-gray-50">
                            <input type="number" id="eRate" placeholder="Hourly OT Rate" class="p-2 border rounded text-sm bg-gray-50">
                        </div>
                        <button onclick="saveEmployee()" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold shadow active:scale-95 transition">Save Employee</button>
                    </div>
                </div>

                <!-- TAB 2: ADMIN KIOSK PUNCH (Redesigned Camera Size) -->
                <div id="tab-punch" class="hidden flex-col bg-gray-50 min-h-full">
                    <div class="h-72 bg-black relative flex items-center justify-center overflow-hidden m-4 rounded-2xl shadow-inner border-4 border-gray-200">
                        <video id="adminVideo" autoplay muted playsinline class="object-cover w-full h-full transform scale-x-[-1]"></video>
                        <div class="absolute inset-0 border-2 border-dashed border-white opacity-40 m-8 rounded-full pointer-events-none flex items-center justify-center">
                            <div class="w-full h-full bg-black bg-opacity-20 rounded-full"></div>
                        </div>
                        <div class="absolute bottom-4 left-0 right-0 flex justify-center">
                            <p id="adminStatusText" class="text-white bg-black bg-opacity-70 px-4 py-2 rounded-full font-semibold text-xs tracking-wider uppercase backdrop-blur-sm shadow-lg">
                                <i class="fas fa-spinner fa-spin mr-2"></i>Initializing...
                            </p>
                        </div>
                    </div>
                    
                    <div class="flex-grow flex flex-col justify-start px-6">
                        <p class="text-center text-sm font-medium text-gray-500 mb-4">Position face in frame (Location bypass active)</p>
                        <div class="grid grid-cols-2 gap-4">
                            <button onclick="adminKioskPunch('in')" class="bg-green-500 hover:bg-green-600 text-white py-5 rounded-2xl font-bold text-lg shadow-[0_4px_14px_0_rgba(34,197,94,0.39)] active:scale-95 transition flex flex-col items-center gap-1"><i class="fas fa-sign-in-alt text-2xl"></i>PUNCH IN</button>
                            <button onclick="adminKioskPunch('out')" class="bg-orange-500 hover:bg-orange-600 text-white py-5 rounded-2xl font-bold text-lg shadow-[0_4px_14px_0_rgba(249,115,22,0.39)] active:scale-95 transition flex flex-col items-center gap-1"><i class="fas fa-sign-out-alt text-2xl"></i>PUNCH OUT</button>
                        </div>
                    </div>
                </div>

                <!-- TAB 3: REPORTS -->
                <div id="tab-reports" class="hidden flex-col bg-white min-h-full">
                    <div class="flex flex-col w-full divide-y divide-gray-100">
                        <button onclick="exportCSV('Daily Time')" class="flex items-center gap-4 p-4 hover:bg-gray-50 text-sm text-gray-700"><i class="far fa-calendar-day text-gray-400 w-5"></i> Daily Time Tracking Report</button>
                        <button onclick="exportCSV('Punch Log')" class="flex items-center gap-4 p-4 hover:bg-gray-50 text-sm text-gray-700"><i class="fas fa-file-invoice text-gray-400 w-5"></i> Punch Log Report</button>
                    </div>
                </div>

                <!-- TAB 4: SETTINGS -->
                <div id="tab-settings" class="hidden flex-col bg-white min-h-full">
                    <div class="bg-gray-100 p-2 px-4 text-xs font-bold text-gray-600 uppercase">Management</div>
                    <div class="flex flex-col w-full divide-y divide-gray-100">
                        <button onclick="openLocationModal()" class="flex items-center justify-between p-4 hover:bg-gray-50 text-sm text-gray-700">
                            <div class="flex items-center gap-4"><i class="fas fa-map-marker-alt text-gray-400 w-5"></i> Location & Geofencing</div>
                            <i class="fas fa-chevron-right text-gray-300"></i>
                        </button>
                        <button onclick="toggleModal('salaryModal')" class="flex items-center justify-between p-4 hover:bg-gray-50 text-sm text-gray-700">
                            <div class="flex items-center gap-4"><i class="fas fa-money-check-alt text-gray-400 w-5"></i> Salary & Overtime Config</div>
                            <i class="fas fa-chevron-right text-gray-300"></i>
                        </button>
                    </div>
                </div>

            </main>

            <!-- FOOTER NAVIGATION -->
            <footer class="bg-white border-t flex justify-around p-2 text-gray-500 text-[10px] shadow-[0_-2px_10px_rgba(0,0,0,0.05)] z-20 flex-shrink-0">
                <button id="nav-dashboard" onclick="switchTab('dashboard')" class="flex flex-col items-center text-blue-600 font-bold w-1/4"><i class="fas fa-th-large text-xl mb-1"></i> Dashboard</button>
                <button id="nav-punch" onclick="switchTab('punch')" class="flex flex-col items-center hover:text-blue-600 w-1/4"><i class="fas fa-camera text-xl mb-1"></i> Punch</button>
                <button id="nav-reports" onclick="switchTab('reports')" class="flex flex-col items-center hover:text-blue-600 w-1/4"><i class="fas fa-file-alt text-xl mb-1"></i> Reports</button>
                <button id="nav-settings" onclick="switchTab('settings')" class="flex flex-col items-center hover:text-blue-600 w-1/4"><i class="fas fa-cog text-xl mb-1"></i> Settings</button>
            </footer>
        </div>

        <!-- MODALS -->
        <!-- Location Modal -->
        <div id="locationModal" class="hidden absolute inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm">
                <h3 class="font-bold text-lg mb-4 text-gray-800"><i class="fas fa-map-marker-alt text-blue-500 mr-2"></i> Geofencing Setup</h3>
                
                <!-- Saved State View -->
                <div id="locSavedView" class="hidden mb-4 bg-green-50 border border-green-200 p-3 rounded-lg text-sm">
                    <p class="font-bold text-green-700 mb-1"><i class="fas fa-check-circle mr-1"></i> Location Saved</p>
                    <p class="text-gray-600 text-xs">Lat: <span id="lblLat" class="font-mono text-black"></span></p>
                    <p class="text-gray-600 text-xs">Lng: <span id="lblLng" class="font-mono text-black"></span></p>
                    <p class="text-gray-600 text-xs">Radius: <span id="lblRad" class="font-mono text-black"></span>m</p>
                    <button onclick="editLocation()" class="mt-3 w-full bg-white border border-gray-300 text-gray-700 py-1.5 rounded font-bold text-xs hover:bg-gray-50">Edit Coordinates</button>
                </div>

                <!-- Input View -->
                <div id="locInputView">
                    <button onclick="scanLocation()" class="w-full bg-indigo-100 text-indigo-700 font-bold py-2 rounded-lg mb-3 text-sm flex items-center justify-center gap-2 hover:bg-indigo-200 transition"><i class="fas fa-crosshairs"></i> Scan Current Location</button>
                    <input type="text" id="locLat" placeholder="Latitude" class="w-full p-3 border rounded mb-2 text-sm bg-gray-50">
                    <input type="text" id="locLong" placeholder="Longitude" class="w-full p-3 border rounded mb-2 text-sm bg-gray-50">
                    <input type="number" id="locRadius" placeholder="Allowed Radius (Meters) e.g. 50" class="w-full p-3 border rounded mb-4 text-sm bg-gray-50">
                </div>

                <div class="flex gap-2 border-t pt-4">
                    <button onclick="toggleModal('locationModal')" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded font-bold text-sm">Close</button>
                    <button id="locSaveBtn" onclick="saveLocation()" class="flex-1 bg-blue-600 text-white py-2 rounded font-bold text-sm">Save Geofence</button>
                </div>
            </div>
        </div>

        <!-- Salary Modal -->
        <div id="salaryModal" class="hidden absolute inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
            <div class="bg-white rounded-xl shadow-2xl p-6 w-full max-w-sm">
                <h3 class="font-bold text-lg mb-4 text-gray-800"><i class="fas fa-money-bill-wave text-green-500 mr-2"></i> Salary Config</h3>
                <input type="number" placeholder="Standard Working Hours (e.g. 8)" class="w-full p-3 border rounded mb-3 text-sm bg-gray-50">
                <input type="number" placeholder="Global Overtime Multiplier (e.g. 1.5)" class="w-full p-3 border rounded mb-4 text-sm bg-gray-50">
                <div class="flex gap-2">
                    <button onclick="toggleModal('salaryModal')" class="flex-1 bg-gray-200 text-gray-700 py-2 rounded font-bold text-sm">Cancel</button>
                    <button onclick="alert('Saved!'); toggleModal('salaryModal');" class="flex-1 bg-green-600 text-white py-2 rounded font-bold text-sm">Save</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://cighgvyjwaagdhmiohlb.supabase.co';
        const supabaseKey = 'sb_publishable_ZTzdxKpodw0lWcBaMt0IzQ_leTZnHfC';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        let allEmployees = [];
        let currentAdmin = null;
        let adminFaceMatcher = null;
        const adminVideo = document.getElementById('adminVideo');

        // --- AUTHENTICATION ---
        async function adminLogin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            if(!email || !password) return alert("Please enter credentials.");

            const { data, error } = await supabaseClient.from('admins').select('*').eq('email', email).eq('password', password).single();
            if (error || !data) return alert("Invalid Admin ID or Password");
            
            currentAdmin = data;
            document.getElementById('headerTitle').innerText = data.firm_name || 'Admin Portal';
            
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('mainAppView').classList.remove('hidden');
            document.getElementById('mainAppView').classList.add('flex');
            
            loadDashboard();
        }

        function logout() {
            currentAdmin = null;
            document.getElementById('mainAppView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
            if (adminVideo.srcObject) adminVideo.srcObject.getTracks().forEach(t => t.stop());
        }

        // --- NAVIGATION ---
        function switchTab(tabName) {
            ['dashboard', 'punch', 'reports', 'settings'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`tab-${t}`).classList.remove('flex');
                document.getElementById(`nav-${t}`).className = "flex flex-col items-center hover:text-blue-600 w-1/4 text-gray-500";
            });

            document.getElementById(`tab-${tabName}`).classList.remove('hidden');
            document.getElementById(`tab-${tabName}`).classList.add('flex');
            document.getElementById(`nav-${tabName}`).classList.add('text-blue-600', 'font-bold');
            
            if(tabName === 'punch') initAdminKiosk();
            else if (adminVideo.srcObject) adminVideo.srcObject.getTracks().forEach(t => t.stop());
        }

        function toggleModal(modalId) { document.getElementById(modalId).classList.toggle('hidden'); }

        // --- GEOFENCING LOGIC (Admin Setup) ---
        function openLocationModal() {
            if(currentAdmin.geo_lat && currentAdmin.geo_lng) {
                document.getElementById('locSavedView').classList.remove('hidden');
                document.getElementById('locInputView').classList.add('hidden');
                document.getElementById('locSaveBtn').classList.add('hidden');
                
                document.getElementById('lblLat').innerText = currentAdmin.geo_lat;
                document.getElementById('lblLng').innerText = currentAdmin.geo_lng;
                document.getElementById('lblRad').innerText = currentAdmin.geo_radius;
            } else {
                editLocation();
            }
            toggleModal('locationModal');
        }

        function editLocation() {
            document.getElementById('locSavedView').classList.add('hidden');
            document.getElementById('locInputView').classList.remove('hidden');
            document.getElementById('locSaveBtn').classList.remove('hidden');
        }

        function scanLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((pos) => {
                    document.getElementById('locLat').value = pos.coords.latitude;
                    document.getElementById('locLong').value = pos.coords.longitude;
                }, (err) => alert("Error: " + err.message), { enableHighAccuracy: true });
            } else {
                alert("Geolocation is not supported by this browser.");
            }
        }

        async function saveLocation() {
            const lat = document.getElementById('locLat').value;
            const lng = document.getElementById('locLong').value;
            const rad = document.getElementById('locRadius').value;

            if(!lat || !lng || !rad) return alert("Please fill all location fields");

            const { error } = await supabaseClient.from('admins').update({
                geo_lat: parseFloat(lat), geo_lng: parseFloat(lng), geo_radius: parseFloat(rad)
            }).eq('id', currentAdmin.id);

            if(error) return alert("Error saving location: " + error.message);
            
            currentAdmin.geo_lat = lat; currentAdmin.geo_lng = lng; currentAdmin.geo_radius = rad;
            alert("Geofence activated successfully!");
            toggleModal('locationModal');
        }

        // --- DASHBOARD LOGIC (Same as previous iteration) ---
        function formatTime(isoStr) { return isoStr ? new Date(isoStr).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) : '--:--'; }
        
        function calculateLate(empTiming, firstPunchInISO) {
            if(!empTiming || empTiming === 'Flexi Shift' || !firstPunchInISO) return false;
            const [expHour, expMin] = empTiming.split(' TO ')[0].split(':').map(Number);
            const actualTime = new Date(firstPunchInISO);
            const expectedTime = new Date(firstPunchInISO);
            expectedTime.setHours(expHour, expMin, 0, 0);
            expectedTime.setMinutes(expectedTime.getMinutes() + 10);
            return actualTime > expectedTime;
        }

        async function loadDashboard() {
            const today = new Date().toISOString().split('T')[0];
            const { data: employees } = await supabaseClient.from('employees').select('*').eq('admin_id', currentAdmin.id);
            const { data: attendance } = await supabaseClient.from('attendance').select('*').eq('date', today);
            
            allEmployees = employees.map(emp => {
                const record = attendance?.find(a => a.employee_id === emp.id);
                let status = 'missing'; let totalHrs = 0; let punches = []; let isLate = false;
                
                if (record && record.punches && record.punches.length > 0) {
                    punches = record.punches;
                    status = punches[punches.length - 1].out ? 'out' : 'in';
                    totalHrs = record.total_hours || 0;
                    if(record.status === 'Late') isLate = true;
                    else if(calculateLate(emp.work_timing, punches[0].in)) isLate = true;
                }
                if(record && record.status === 'Absent') status = 'missing';
                return { ...emp, status, isLate, totalHrs, punches, recordId: record?.id };
            });
            updateStats(); renderList(allEmployees);
        }

        function updateStats() {
            document.getElementById('countAll').innerText = allEmployees.length;
            document.getElementById('countIn').innerText = allEmployees.filter(e => e.status === 'in').length;
            document.getElementById('countOut').innerText = allEmployees.filter(e => e.status === 'out').length;
            document.getElementById('countMissing').innerText = allEmployees.filter(e => e.status === 'missing').length;
            document.getElementById('countLate').innerText = allEmployees.filter(e => e.isLate).length;
        }

        function renderList(list) {
            document.getElementById('employeeList').innerHTML = list.map(emp => {
                const firstIn = emp.punches.length > 0 ? formatTime(emp.punches[0].in) : '--:--';
                const lastOut = (emp.punches.length > 0 && emp.punches[emp.punches.length-1].out) ? formatTime(emp.punches[emp.punches.length-1].out) : '--:--';
                let badge = emp.status === 'missing' ? `<span class="bg-gray-100 text-gray-500 text-[10px] px-2 py-1 rounded font-bold uppercase">Absent</span>` : 
                            emp.status === 'in' ? `<span class="bg-green-100 text-green-700 text-[10px] px-2 py-1 rounded font-bold uppercase">In</span>` : 
                            `<span class="bg-orange-100 text-orange-700 text-[10px] px-2 py-1 rounded font-bold uppercase">Out</span>`;
                if(emp.isLate) badge += ` <span class="bg-red-100 text-red-700 text-[10px] px-2 py-1 rounded font-bold uppercase ml-1">Late</span>`;

                return `
                <div class="bg-white border border-gray-200 rounded-lg p-3 shadow-sm flex flex-col relative">
                    <div class="flex justify-between items-start mb-2">
                        <div><p class="font-bold text-gray-800 text-sm leading-tight">${emp.name}</p></div>
                        <div>${badge}</div>
                    </div>
                    <div class="flex justify-between bg-gray-50 p-2 rounded border items-center">
                        <div class="text-xs"><span class="text-gray-400 font-bold uppercase block text-[9px]">IN Time</span><span class="text-green-600 font-bold">${firstIn}</span></div>
                        <div class="text-xs text-right"><span class="text-gray-400 font-bold uppercase block text-[9px]">OUT Time</span><span class="text-orange-600 font-bold">${lastOut}</span></div>
                    </div>
                    <div class="flex gap-2 mt-3 pt-2 border-t border-dashed border-gray-200">
                        <button onclick="overrideStatus('${emp.id}', 'Absent')" class="flex-1 bg-gray-100 hover:bg-red-100 text-gray-600 hover:text-red-600 py-1 rounded text-[10px] font-bold">Mark Absent</button>
                        <button onclick="overrideStatus('${emp.id}', 'Late')" class="flex-1 bg-gray-100 hover:bg-orange-100 text-gray-600 hover:text-orange-600 py-1 rounded text-[10px] font-bold">Mark Late</button>
                    </div>
                </div>`;
            }).join('');
        }

        async function overrideStatus(empId, statusStr) {
            const dateOnly = new Date().toISOString().split('T')[0];
            const empData = allEmployees.find(e => e.id === empId);
            if(empData.recordId) await supabaseClient.from('attendance').update({ status: statusStr }).eq('id', empData.recordId);
            else await supabaseClient.from('attendance').insert([{ employee_id: empId, date: dateOnly, status: statusStr, punches: [], total_hours: 0 }]);
            alert(`Employee marked as ${statusStr}`);
            loadDashboard();
        }

        function toggleAddForm() { document.getElementById('addEmployeeForm').classList.toggle('hidden'); }
        function handleDeptChange() {
            const sel = document.getElementById('eDept'); const other = document.getElementById('eDeptOther');
            if(sel.value === 'Other') other.classList.remove('hidden'); else other.classList.add('hidden');
        }

        async function saveEmployee() {
            let dept = document.getElementById('eDept').value === 'Other' ? document.getElementById('eDeptOther').value : document.getElementById('eDept').value;
            const empData = {
                admin_id: currentAdmin.id, name: document.getElementById('eName').value,
                emp_code: document.getElementById('eCode').value, login_id: document.getElementById('eLogin').value,
                password: document.getElementById('ePass').value, department: dept || 'General',
                work_timing: document.getElementById('eTiming').value, monthly_salary: document.getElementById('eSalary').value || 0,
                overtime_rate: document.getElementById('eRate').value || 0
            };
            const { error } = await supabaseClient.from('employees').insert([empData]);
            if (error) alert("Error: " + error.message);
            else { alert("Saved!"); toggleAddForm(); loadDashboard(); }
        }

        // --- ADMIN KIOSK PUNCH (Bypasses Location Automatically) ---
        async function initAdminKiosk() {
            const statusEl = document.getElementById('adminStatusText');
            statusEl.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Loading AI...';
            try {
                const MODEL_URL = './models';
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                const labeledDescriptors = [];
                for (let i = 0; i < allEmployees.length; i++) {
                    if (allEmployees[i].face_descriptor) {
                        labeledDescriptors.push(new faceapi.LabeledFaceDescriptors(allEmployees[i].id, [new Float32Array(JSON.parse(allEmployees[i].face_descriptor))]));
                    }
                }
                if(labeledDescriptors.length > 0) {
                    adminFaceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.6);
                    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } });
                    adminVideo.srcObject = stream;
                    statusEl.innerHTML = '<i class="fas fa-check-circle mr-2 text-green-400"></i>Scanner Ready (No Geo-Lock)';
                } else statusEl.innerHTML = '<i class="fas fa-exclamation-circle text-red-400"></i> No Faces';
            } catch (err) { statusEl.innerHTML = '<i class="fas fa-video-slash text-red-500"></i> Error'; }
        }

        async function adminKioskPunch(type) {
            if(!adminFaceMatcher) return alert("System not ready.");
            const statusEl = document.getElementById('adminStatusText');
            statusEl.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Scanning Face...';

            const detection = await faceapi.detectSingleFace(adminVideo).withFaceLandmarks().withFaceDescriptor();
            if (!detection) return alert("No face detected!");

            const match = adminFaceMatcher.findBestMatch(detection.descriptor);
            if (match.label === 'unknown') return alert("Face not recognized!");

            const emp = allEmployees.find(e => e.id === match.label);
            
            // Note: In production, insert/update the exact JSON punch arrays here the same way user.html does
            alert(`Admin Bypass Success! Punched ${type.toUpperCase()} for ${emp.name}`);
            statusEl.innerHTML = `<span class="text-green-400 font-bold">${emp.name} Punched ${type.toUpperCase()}!</span>`;
            setTimeout(() => { statusEl.innerHTML = '<i class="fas fa-check-circle mr-2 text-green-400"></i>Scanner Ready'; loadDashboard(); }, 3000);
        }
    </script>
