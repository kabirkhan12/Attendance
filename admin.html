<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 flex justify-center h-screen">
    <div class="w-full max-w-md bg-white h-full shadow-lg flex flex-col relative overflow-hidden">
        
        <!-- ================= LOGIN VIEW ================= -->
        <div id="loginView" class="p-8 flex flex-col justify-center h-full bg-white z-50 absolute inset-0">
            <div class="text-center mb-8">
                <i class="fas fa-fingerprint text-5xl text-blue-600 mb-3"></i>
                <h1 class="text-3xl font-bold text-gray-800">Admin Login</h1>
                <p class="text-gray-500 text-sm mt-1">Manage your workforce</p>
            </div>
            <input type="text" id="adminEmail" placeholder="Admin ID (e.g. gsm_admin)" class="p-4 border rounded-lg mb-4 bg-gray-50 focus:outline-none focus:border-blue-500">
            <input type="password" id="adminPassword" placeholder="Password" class="p-4 border rounded-lg mb-8 bg-gray-50 focus:outline-none focus:border-blue-500">
            <button onclick="adminLogin()" class="bg-blue-600 text-white p-4 rounded-lg font-bold shadow-lg active:scale-95 transition">Login to Dashboard</button>
        </div>

        <!-- ================= DASHBOARD VIEW (Hidden initially) ================= -->
        <div id="dashboardView" class="hidden flex-col h-full w-full">
            
            <!-- HEADER -->
            <div class="bg-blue-600 p-4 text-white flex justify-between items-center shadow-md z-10">
                <!-- Dynamically shows the Firm Name -->
                <h1 id="firmNameDisplay" class="text-xl font-bold">Loading...</h1>
                <div class="flex gap-4">
                    <!-- Logout Button (CSV removed) -->
                    <button onclick="logout()"><i class="fas fa-sign-out-alt text-xl hover:text-red-300 transition"></i></button>
                </div>
            </div>

            <!-- MAIN SCROLLABLE CONTENT -->
            <div class="flex-grow overflow-y-auto p-4 pb-20">
                
                <!-- Employee Summary Dashboard -->
                <h2 class="text-sm font-bold text-gray-700 mb-2">Employee Summary</h2>
                <div class="grid grid-cols-5 gap-2 mb-4 text-center">
                    <button onclick="filterList('all')" class="border rounded p-2 bg-blue-50 border-blue-200 cursor-pointer hover:bg-blue-100">
                        <p id="countAll" class="text-lg font-bold text-blue-600">0</p>
                        <p class="text-[10px] text-gray-500">All Emp</p>
                    </button>
                    <button onclick="filterList('in')" class="border rounded p-2 cursor-pointer hover:bg-gray-50">
                        <p id="countIn" class="text-lg font-bold text-green-500">0</p>
                        <p class="text-[10px] text-gray-500">Total In</p>
                    </button>
                    <button onclick="filterList('out')" class="border rounded p-2 cursor-pointer hover:bg-gray-50">
                        <p id="countOut" class="text-lg font-bold text-orange-500">0</p>
                        <p class="text-[10px] text-gray-500">Total Out</p>
                    </button>
                    <button onclick="filterList('late')" class="border rounded p-2 cursor-pointer hover:bg-gray-50">
                        <p id="countLate" class="text-lg font-bold text-red-500">0</p>
                        <p class="text-[10px] text-gray-500">Late</p>
                    </button>
                    <button onclick="filterList('missing')" class="border rounded p-2 cursor-pointer hover:bg-gray-50">
                        <p id="countMissing" class="text-lg font-bold text-gray-500">0</p>
                        <p class="text-[10px] text-gray-500">Not Yet In</p>
                    </button>
                </div>

                <!-- Search Bar -->
                <div class="relative mb-4">
                    <i class="fas fa-search absolute left-3 top-3 text-gray-400"></i>
                    <input type="text" id="searchInput" onkeyup="searchEmployees()" placeholder="Search by name or code" class="w-full pl-10 p-2 border rounded-lg bg-gray-50 outline-none focus:border-blue-500 text-sm">
                </div>

                <!-- Employee List -->
                <h2 class="text-sm font-bold text-gray-700 mb-2">Today</h2>
                <div id="employeeList" class="flex flex-col gap-3">
                    <!-- Javascript populates this -->
                </div>

                <!-- Add Employee Button -->
                <div class="mt-6 flex justify-center">
                    <button onclick="toggleAddForm()" class="bg-blue-600 text-white px-6 py-2 rounded-full font-bold shadow-lg hover:bg-blue-700 transition">
                        + Add Employee
                    </button>
                </div>

                <!-- Hidden Add Employee Form -->
                <div id="addEmployeeForm" class="hidden mt-4 bg-white p-4 rounded-lg border shadow-sm">
                    <h3 class="font-bold mb-3 border-b pb-2">New Employee Details</h3>
                    <input type="text" id="eName" placeholder="Name" class="w-full p-2 border rounded mb-2 text-sm bg-gray-50">
                    <input type="text" id="eCode" placeholder="EMP Code" class="w-full p-2 border rounded mb-2 text-sm bg-gray-50">
                    <div class="grid grid-cols-2 gap-2 mb-2">
                        <input type="text" id="eLogin" placeholder="Login ID" class="p-2 border rounded text-sm bg-gray-50">
                        <input type="text" id="ePass" placeholder="Password" class="p-2 border rounded text-sm bg-gray-50">
                    </div>
                    <select id="eDept" class="w-full p-2 border rounded mb-2 text-sm bg-gray-50">
                        <option value="General">General Department</option>
                        <option value="Sales">Sales</option>
                        <option value="Support">Support</option>
                    </select>
                    <select id="eTiming" class="w-full p-2 border rounded mb-2 text-sm bg-gray-50">
                        <option value="9:30 TO 7">9:30 TO 7 (Fixed)</option>
                        <option value="Flexi Shift">Flexi Shift (Dual Timings)</option>
                    </select>
                    <div class="grid grid-cols-2 gap-2 mb-3">
                        <input type="number" id="eSalary" placeholder="Base Salary" class="p-2 border rounded text-sm bg-gray-50">
                        <input type="number" id="eRate" placeholder="Hourly OT Rate" class="p-2 border rounded text-sm bg-gray-50">
                    </div>
                    <button onclick="saveEmployee()" class="w-full bg-green-600 text-white p-3 rounded-lg font-bold shadow active:scale-95 transition">Save Employee</button>
                </div>

            </div>

            <!-- ================= BOTTOM NAVIGATION ================= -->
            <div class="absolute bottom-0 w-full bg-white border-t flex justify-around p-3 text-gray-500 text-xs shadow-[0_-2px_10px_rgba(0,0,0,0.05)]">
                <!-- Punch is removed, only 3 tabs remain -->
                <button class="flex flex-col items-center text-blue-600 font-bold">
                    <i class="fas fa-th-large text-lg mb-1"></i> Dashboard
                </button>
                <button class="flex flex-col items-center hover:text-blue-600 transition">
                    <i class="fas fa-file-alt text-lg mb-1"></i> Reports
                </button>
                <button class="flex flex-col items-center hover:text-blue-600 transition">
                    <i class="fas fa-cog text-lg mb-1"></i> Settings
                </button>
            </div>

        </div>
    </div>

    <script>
        const supabaseUrl = 'https://cighgvyjwaagdhmiohlb.supabase.co';
        const supabaseKey = 'sb_publishable_ZTzdxKpodw0lWcBaMt0IzQ_leTZnHfC';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);
        
        let allEmployees = [];
        let currentAdminId = null;

        // --- AUTHENTICATION LOGIC ---
        async function adminLogin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            
            if(!email || !password) return alert("Please enter credentials.");

            const { data, error } = await supabaseClient.from('admins').select('*')
                .eq('email', email).eq('password', password).single();
            
            if (error || !data) return alert("Invalid Admin ID or Password");
            
            // Set session data
            currentAdminId = data.id;
            document.getElementById('firmNameDisplay').innerText = data.firm_name || 'Admin Portal';
            
            // Switch UI views
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            document.getElementById('dashboardView').classList.add('flex');
            
            loadDashboard();
        }

        function logout() {
            currentAdminId = null;
            allEmployees = [];
            
            // Clear inputs
            document.getElementById('adminEmail').value = '';
            document.getElementById('adminPassword').value = '';
            
            // Reset UI
            document.getElementById('dashboardView').classList.remove('flex');
            document.getElementById('dashboardView').classList.add('hidden');
            document.getElementById('loginView').classList.remove('hidden');
            document.getElementById('employeeList').innerHTML = '';
        }

        // --- DASHBOARD LOGIC ---
        async function loadDashboard() {
            const today = new Date().toISOString().split('T')[0];
            
            // Fetch employees for THIS specific firm admin
            const { data: employees } = await supabaseClient.from('employees').select('*').eq('admin_id', currentAdminId);
            if(!employees) return;

            // Fetch today's attendance for those employees
            const { data: attendance } = await supabaseClient.from('attendance').select('*').eq('date', today);
            
            allEmployees = employees.map(emp => {
                const record = attendance?.find(a => a.employee_id === emp.id);
                let status = 'missing';
                let totalHrs = 0;
                
                if (record && record.punches && record.punches.length > 0) {
                    const lastPunch = record.punches[record.punches.length - 1];
                    status = lastPunch.out ? 'out' : 'in';
                    totalHrs = record.total_hours || 0;
                }
                
                return { ...emp, status, totalHrs };
            });
            
            updateStats();
            renderList(allEmployees);
        }

        function updateStats() {
            document.getElementById('countAll').innerText = allEmployees.length;
            document.getElementById('countIn').innerText = allEmployees.filter(e => e.status === 'in').length;
            document.getElementById('countOut').innerText = allEmployees.filter(e => e.status === 'out').length;
            document.getElementById('countMissing').innerText = allEmployees.filter(e => e.status === 'missing').length;
            
            // Temporary Late calculation placeholder
            document.getElementById('countLate').innerText = "0"; 
        }

        function renderList(list) {
            const container = document.getElementById('employeeList');
            if (list.length === 0) {
                container.innerHTML = '<p class="text-center text-gray-500 text-sm mt-4">No employees found.</p>';
                return;
            }

            container.innerHTML = list.map(emp => `
                <div class="bg-white border rounded-lg p-3 flex items-center justify-between shadow-sm">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-700 font-bold">
                            ${emp.name.charAt(0).toUpperCase()}
                        </div>
                        <div>
                            <p class="font-bold text-gray-800 text-sm">${emp.name}</p>
                            <p class="text-[11px] text-gray-500">Code: ${emp.emp_code || '-'} | Hrs: ${emp.totalHrs.toFixed(2)}</p>
                        </div>
                    </div>
                    <div>
                        ${emp.status === 'missing' 
                            ? `<span class="bg-purple-50 text-purple-600 border border-purple-200 text-[10px] px-2 py-1 rounded font-bold uppercase tracking-wider">Not Yet In</span>` 
                            : `<span class="${emp.status === 'in' ? 'bg-green-50 text-green-600 border-green-200' : 'bg-orange-50 text-orange-600 border-orange-200'} border text-[10px] px-2 py-1 rounded font-bold uppercase tracking-wider">${emp.status}</span>`
                        }
                    </div>
                </div>
            `).join('');
        }

        function searchEmployees() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allEmployees.filter(e => 
                e.name.toLowerCase().includes(term) || 
                (e.emp_code && e.emp_code.toLowerCase().includes(term))
            );
            renderList(filtered);
        }

        function filterList(status) {
            if (status === 'all') renderList(allEmployees);
            else renderList(allEmployees.filter(e => e.status === status));
        }

        function toggleAddForm() {
            document.getElementById('addEmployeeForm').classList.toggle('hidden');
        }

        async function saveEmployee() {
            if (!currentAdminId) return alert("Session expired.");

            const empData = {
                admin_id: currentAdminId,
                name: document.getElementById('eName').value,
                emp_code: document.getElementById('eCode').value,
                login_id: document.getElementById('eLogin').value,
                password: document.getElementById('ePass').value,
                department: document.getElementById('eDept').value,
                work_timing: document.getElementById('eTiming').value,
                monthly_salary: document.getElementById('eSalary').value || 0,
                overtime_rate: document.getElementById('eRate').value || 0
            };

            if(!empData.name || !empData.login_id || !empData.password) {
                return alert("Name, Login ID, and Password are required!");
            }

            const { error } = await supabaseClient.from('employees').insert([empData]);
            
            if (error) {
                if (error.code === '23505') alert("This Login ID is already taken.");
                else alert("Error: " + error.message);
            } else {
                alert("Employee Saved Successfully!");
                toggleAddForm(); // Hide form
                document.querySelectorAll('#addEmployeeForm input').forEach(i => i.value = ''); // Clear inputs
                loadDashboard(); // Refresh list
            }
        }
    </script>
</body>
</html>
