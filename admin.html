<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Portal</title>
    <link rel="icon" href="data:,">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-100 flex justify-center h-screen">
    <div class="w-full max-w-md bg-white h-full shadow-lg flex flex-col">
        
        <!-- LOGIN VIEW -->
        <div id="loginView" class="p-6 flex flex-col justify-center h-full">
            <a href="index.html" class="text-blue-500 mb-6">&larr; Back to Home</a>
            <h1 class="text-2xl font-bold mb-6">Admin Login</h1>
            <input type="email" id="adminEmail" placeholder="Email (e.g. admin@admin.com)" class="p-3 border rounded mb-3 bg-gray-50">
            <input type="password" id="adminPassword" placeholder="Password (e.g. admin123)" class="p-3 border rounded mb-6 bg-gray-50">
            <button onclick="adminLogin()" class="bg-gray-800 text-white p-3 rounded font-bold">Login</button>
        </div>

        <!-- DASHBOARD VIEW (Hidden initially) -->
        <div id="dashboardView" class="hidden p-6 overflow-y-auto h-full">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-xl font-bold">Admin Dashboard</h1>
                <button onclick="logout()" class="text-red-500 font-bold text-sm">Logout</button>
            </div>

            <!-- Add Employee Form -->
            <div class="bg-blue-50 p-4 rounded-lg border border-blue-200 mb-6">
                <h2 class="font-bold mb-3">Add New Employee</h2>
                <input type="text" id="eName" placeholder="Full Name" class="w-full p-2 border rounded mb-2 text-sm">
                <input type="text" id="eLoginId" placeholder="Create Login ID (e.g. user01)" class="w-full p-2 border rounded mb-2 text-sm">
                <input type="text" id="ePassword" placeholder="Create Password" class="w-full p-2 border rounded mb-2 text-sm">
                <div class="flex gap-2 mb-2">
                    <input type="tel" id="eMobile" placeholder="Mobile" class="w-1/2 p-2 border rounded text-sm">
                    <input type="number" id="eSalary" placeholder="Salary" class="w-1/4 p-2 border rounded text-sm">
                    <input type="number" id="eHours" placeholder="Hours" class="w-1/4 p-2 border rounded text-sm">
                </div>
                <button onclick="addEmployee()" class="w-full bg-blue-600 text-white p-2 rounded font-bold text-sm">Create Account</button>
            </div>

            <!-- Employee List -->
            <h2 class="font-bold mb-3">All Employees</h2>
            <div id="employeeList" class="flex flex-col gap-2"></div>
        </div>

    </div>

    <script>
        const supabaseUrl = 'https://cighgvyjwaagdhmiohlb.supabase.co';
        const supabaseKey = 'sb_publishable_ZTzdxKpodw0lWcBaMt0IzQ_leTZnHfC';
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseKey);

        async function adminLogin() {
            const email = document.getElementById('adminEmail').value;
            const password = document.getElementById('adminPassword').value;
            
            const { data, error } = await supabaseClient.from('admins').select('*')
                .eq('email', email).eq('password', password).single();
            
            if (error || !data) return alert("Invalid Email or Password");
            
            document.getElementById('loginView').classList.add('hidden');
            document.getElementById('dashboardView').classList.remove('hidden');
            loadEmployees();
        }

        async function addEmployee() {
            const empData = {
                name: document.getElementById('eName').value,
                login_id: document.getElementById('eLoginId').value,
                password: document.getElementById('ePassword').value,
                mobile_no: document.getElementById('eMobile').value,
                monthly_salary: document.getElementById('eSalary').value || 0,
                working_hours: document.getElementById('eHours').value || 0
            };

            if(!empData.name || !empData.login_id || !empData.password) return alert("Name, Login ID, and Password are required!");

            const { error } = await supabaseClient.from('employees').insert([empData]);
            if (error) alert("Error: " + error.message);
            else {
                alert("Employee created successfully!");
                document.querySelectorAll('input').forEach(i => i.value = '');
                loadEmployees();
            }
        }

        async function loadEmployees() {
            const { data, error } = await supabaseClient.from('employees').select('*').order('created_at', { ascending: false });
            if (error) return;
            
            const list = document.getElementById('employeeList');
            list.innerHTML = data.map(emp => `
                <div class="bg-gray-50 p-3 rounded border text-sm">
                    <p class="font-bold">${emp.name} <span class="text-xs font-normal text-gray-500">(${emp.face_descriptor ? '🟢 Face Registered' : '🔴 No Face'})</span></p>
                    <p>Login ID: <b>${emp.login_id}</b> | Pass: <b>${emp.password}</b></p>
                    <p class="text-gray-600">Mob: ${emp.mobile_no} | Hrs: ${emp.working_hours}</p>
                </div>
            `).join('');
        }

        function logout() { location.reload(); }
    </script>
</body>
</html>
